# ============================================================================
# Judge0 — Isolate Sandbox Configuration
# ----------------------------------------------------------------------------
# Mounted into the judge0-workers container at
#   /judge0/IsolateConfig/isolate.conf
# Source: https://github.com/ioi/isolate
#
# These limits cap what user-submitted code is allowed to do. The Judge0
# server-side MAX_* env vars are the user-facing knobs; this file is the
# hard kernel-level cap that `isolate` enforces.
# ============================================================================

# CPU time per process (seconds) — wall clock for the process, not the wall
# time of the whole run. Catches infinite loops.
max-cpu-time=5

# Wall time (seconds) — hard kill timer. Slightly above max-cpu-time so
# legitimate I/O is not punished.
max-wall-time=10

# Virtual memory limit (KB). 256 MB.
max-memory=256000

# Stack size (KB). 128 MB.
max-stack-size=128000

# Maximum size of captured stdout+stderr (bytes).
max-output-size=65536

# Number of processes / threads the user code can spawn.
max-processes=64

# Extra open file descriptors.
max-open-files=256

# Extra file size for any single file write (bytes).
max-file-size=4096

# Apply rlimits per-process (not just at the cgroup level).
enable-per-process-and-thread-resource-limits=true

# --- Network ---
# Hard block: no outbound network from inside the sandbox.
enable-network=false

# --- Chroot dirs ---
# We restrict what's mounted into the sandbox: only what user code needs.
chroot-dirs=/usr:/lib:/lib64:/bin:/etc/alternatives:/etc/ssl/certs

# --- Misc ---
# Disable core dumps.
disable-coredump=true

# Verbose logging on failure (helps debug "why did my submission fail").
verbose=false

# When a process exceeds limits, kill it before isolate returns.
kill-after-timeout=2

# Default working directory.
cg-mem-limit=262144
box-extra-rules=|