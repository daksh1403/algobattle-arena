# ============================================================================
# Judge0 — Isolated Compose File
# ----------------------------------------------------------------------------
# Brought up separately from the main stack. Why?
#   1. Judge0 needs privileged containers (for cgroups/isolate).
#   2. We want it on its own bridge network — no internet from user code,
#      no shared surface with the API.
#   3. In prod it runs on a dedicated EC2 (modules/judge0 in Terraform).
#
# Usage:
#   make prod-full         # compose + judge0 together (single host)
#   cd judge0 && docker compose up   # standalone
#
# Components (per official Judge0 v1.13 stack, pinned):
#   server    — REST API on :2358
#   workers   — isolated execution of submissions (privileged)
#   postgres  — Judge0's internal DB
#   redis     — Judge0's internal queue (different from ours)
#   isolate   — runs as init (cgroups)
# ============================================================================

version: "3.9"

networks:
  judge0-internal:
    driver: bridge
    internal: false     # the SERVER needs to reach the API for callbacks
    name: algobattle-judge0
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  judge0_pg_data:

# Read token from main .env so the API and Judge0 share auth
x-restart: &restart
  restart: unless-stopped

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: algobattle-judge0-server
    <<: *restart
    command: ["/api/docker-entrypoint.sh"]
    environment:
      # --- PostgreSQL ---
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set in .env}
      # --- Redis ---
      - REDIS_HOST=judge0-redis
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:?set in .env}
      # --- App ---
      - ALLOW_ENABLE_NETWORK=${JUDGE0_ENABLE_NETWORK:-false}
      - ALLOW_ENABLE_PER_PROCESS_AND_THREAD_RESOURCE_LIMITS=true
      - ALLOW_ENABLE_COMPILER_OPTIONS=true
      - ALLOW_COMMAND_LINE_ARGUMENTS=true
      - ALLOW_MULTIPART_FORM_DATA=true
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      - ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=*
      - ENABLE_COMMAND_LINE_ARGUMENTS=true
      - DISABLE_AUTHN=false
      - DISABLE_BATCH_SUBMISSION=true   # we use single submission per judge call
      - USE_DOCKER_GRABBER=false
      # --- Resource limits (mirrored in isolation.conf) ---
      - MAX_CPU_TIME_LIMIT=20
      - MAX_EXTRA_CPU_TIME_LIMIT=5
      - MAX_WALL_TIME_LIMIT=30
      - MAX_MEMORY_LIMIT=512000
      - MAX_STACK_LIMIT=128000
      - MAX_MAX_PROCESSES=64
      - MAX_ENABLE_PER_PROCESS_AND_THREAD_RESOURCE_LIMITS=true
      - MAX_OUTPUT_LIMIT=65536
      # --- Callbacks ---
      - CALLBACK_URL=${JUDGE0_CALLBACK_URL}
      - CALLBACK_TOKEN=${JUDGE0_AUTH_TOKEN}
      # --- Logging ---
      - DISABLE_PULL_LOG_DURING_BUILD=true
      - DISABLE_COMPILE_OUTPUT=false
    ports:
      # Only the API and worker reach Judge0 — exposed on host for debugging.
      # In production single-host we keep this on the bridge and rely on
      # explicit Traefik routing; for true isolation, run on a separate VM
      # and only allow 2358 from the API host.
      - "127.0.0.1:2358:2358"
    networks:
      judge0-internal:
        ipv4_address: 172.30.0.10
    depends_on:
      - judge0-db
      - judge0-redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2358/about"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: algobattle-judge0-workers
    <<: *restart
    command: ["/judge0-workers/docker-entrypoint.sh"]
    privileged: true          # required for cgroups + isolate
    environment:
      - POSTGRES_HOST=judge0-db
      - POSTGRES_DB=judge0db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set in .env}
      - REDIS_HOST=judge0-redis
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:?set in .env}
      - MAX_CPU_TIME_LIMIT=20
      - MAX_WALL_TIME_LIMIT=30
      - MAX_MEMORY_LIMIT=512000
      - ALLOW_ENABLE_NETWORK=${JUDGE0_ENABLE_NETWORK:-false}
    volumes:
      - ./isolation.conf:/judge0/IsolateConfig/isolate.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      judge0-internal:
        ipv4_address: 172.30.0.11
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  judge0-db:
    image: postgres:13-alpine
    container_name: algobattle-judge0-db
    <<: *restart
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=judge0db
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data
    networks:
      judge0-internal:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0db"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  judge0-redis:
    image: redis:6-alpine
    container_name: algobattle-judge0-redis
    <<: *restart
    command:
      - "redis-server"
      - "--requirepass"
      - "${JUDGE0_REDIS_PASSWORD:?set in .env}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "noeviction"
    networks:
      judge0-internal:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${JUDGE0_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 192M