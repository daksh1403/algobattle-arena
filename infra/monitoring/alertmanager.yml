# ============================================================================
# Alertmanager configuration
# ----------------------------------------------------------------------------
# Receives alerts from Prometheus, groups, routes, deduplicates, then
# dispatches to Slack/PagerDuty/email. Read webhook from .env at startup.
# ============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@algobattle.example.com"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "default-slack"
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical page-worthy alerts
    - matchers:
        - severity = "critical"
      receiver: "critical-pager"
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # API/DB criticals also go to email
    - matchers:
        - severity = "critical"
        - service =~ "api|postgres|redis|judge0"
      receiver: "ops-email"

    # Judge alerts → engineering channel
    - matchers:
        - service =~ "judge|judge0"
      receiver: "engineering-slack"

receivers:
  - name: "default-slack"
    slack_configs:
      - api_url: "${ALERTMANAGER_WEBHOOK_URL}"
        channel: "#ops"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: "critical-pager"
    slack_configs:
      - api_url: "${ALERTMANAGER_WEBHOOK_URL}"
        channel: "#oncall"
        send_resolved: true

  - name: "engineering-slack"
    slack_configs:
      - api_url: "${ALERTMANAGER_WEBHOOK_URL}"
        channel: "#engineering"
        send_resolved: true

  - name: "ops-email"
    email_configs:
      - to: "ops@algobattle.example.com"
        send_resolved: true
        headers:
          Subject: "[ALGOBATTLE] {{ .CommonAnnotations.summary }}"

inhibit_rules:
  # Critical suppresses warning for the same alert
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, service]

  # API down suppresses API high-latency (cascading cause)
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - alertname =~ "ApiHighLatency.*|ApiHighErrorRate"