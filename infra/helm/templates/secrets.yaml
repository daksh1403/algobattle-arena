# ============================================================================
# Secrets — placeholders only. Override via external secrets manager in prod.
# ----------------------------------------------------------------------------
# Generate real secrets with:
#   kubectl create secret generic algobattle-secrets \
#     --from-literal=postgres-password=$(openssl rand -hex 32) \
#     --from-literal=redis-password=$(openssl rand -hex 32) \
#     --from-literal=secret-key=$(openssl rand -hex 32) \
#     --from-literal=judge0-postgres-password=$(openssl rand -hex 32) \
#     --from-literal=judge0-redis-password=$(openssl rand -hex 32) \
#     --from-literal=judge0-auth-token=$(openssl rand -hex 32) \
#     --from-literal=grafana-admin-password=$(openssl rand -hex 16) \
#     -n algobattle
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "algobattle.secretName" . }}
  labels:
    {{- include "algobattle.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ----- Postgres -----
  postgres-user: algobattle
  postgres-password: REPLACE_ME_postgres_password
  # ----- Redis -----
  redis-password: REPLACE_ME_redis_password
  # ----- API -----
  secret-key: REPLACE_ME_jwt_secret_min_32_chars
  database-password: REPLACE_ME_postgres_password
  # ----- Judge0 -----
  judge0-postgres-password: REPLACE_ME_judge0_postgres
  judge0-redis-password: REPLACE_ME_judge0_redis
  judge0-auth-token: REPLACE_ME_judge0_auth_token
  # ----- Grafana -----
  grafana-admin-user: admin
  grafana-admin-password: REPLACE_ME_grafana_admin