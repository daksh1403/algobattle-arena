{{- if and .Values.postgres.enabled (not .Values.postgres.useExternal) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "algobattle.fullname" . }}-postgres
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "algobattle.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "algobattle.componentSelector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algobattle.componentSelector" (dict "ctx" . "component" "postgres") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: algobattle
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default "algobattle-secrets" }}
                  key: {{ .Values.postgres.auth.usernameKey | default "postgres-user" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default "algobattle-secrets" }}
                  key: {{ .Values.postgres.auth.passwordKey | default "postgres-password" }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "algobattle", "-d", "algobattle"]
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "algobattle", "-d", "algobattle"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: postgres-exporter
          image: {{ .Values.images.postgresExporter }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/algobattle?sslmode=disable
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.auth.existingSecret | default "algobattle-secrets" }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "algobattle.componentLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
      spec:
        accessModes: {{ .Values.postgres.persistence.accessModes | default (list "ReadWriteOnce") }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | default "50Gi" }}
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass }}
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "algobattle.fullname" . }}-postgres
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    {{- include "algobattle.componentSelector" (dict "ctx" . "component" "postgres") | nindent 4 }}
{{- end }}