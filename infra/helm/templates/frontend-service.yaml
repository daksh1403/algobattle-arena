apiVersion: v1
kind: Service
metadata:
  name: {{ include "algobattle.fullname" . }}-frontend
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "algobattle.componentSelector" (dict "ctx" . "component" "frontend") | nindent 4 }}