{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "algobattle.fullname" . }}-grafana
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "algobattle.componentSelector" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algobattle.componentSelector" (dict "ctx" . "component" "grafana") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472        # grafana uid
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "algobattle.secretName" . }}
                  key: grafana-admin-user
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "algobattle.secretName" . }}
                  key: grafana-admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.monitoring.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "algobattle.fullname" . }}-grafana
          {{- else }}
          emptyDir: {}
          {{- end }}

---
{{- if .Values.monitoring.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "algobattle.fullname" . }}-grafana
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size | default "5Gi" }}
  {{- if .Values.monitoring.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.monitoring.grafana.persistence.storageClass }}
  {{- end }}
---
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "algobattle.fullname" . }}-grafana
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "algobattle.componentSelector" (dict "ctx" . "component" "grafana") | nindent 4 }}
{{- end }}