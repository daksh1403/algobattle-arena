apiVersion: v1
kind: Service
metadata:
  name: {{ include "algobattle.fullname" . }}-judge
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "judge") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None       # headless — pods are workers, not a service to call
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "algobattle.componentSelector" (dict "ctx" . "component" "judge") | nindent 4 }}