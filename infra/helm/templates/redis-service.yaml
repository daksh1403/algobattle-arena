apiVersion: v1
kind: Service
metadata:
  name: {{ include "algobattle.fullname" . }}-redis-headless
  labels:
    {{- include "algobattle.componentLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "algobattle.componentSelector" (dict "ctx" . "component" "redis") | nindent 4 }}