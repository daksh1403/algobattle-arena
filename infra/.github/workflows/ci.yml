# ============================================================================
# CI — lint + test on every push / PR
# ============================================================================
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------------------
  # Backend — Python
  # -------------------------------------------------------------------------
  backend-lint:
    name: backend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install \
            ruff==0.7.2 \
            black==24.10.0 \
            mypy==1.13.0 \
            types-redis \
            types-requests

      - name: ruff
        run: ruff check app tests

      - name: black --check
        run: black --check app tests

      - name: mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true   # type-checking shouldn't block PRs

  backend-test:
    name: backend / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algobattle
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algobattle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algobattle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://algobattle:postgres@localhost:5432/algobattle_test
      DATABASE_URL_SYNC: postgresql://algobattle:postgres@localhost:5432/algobattle_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test_secret_only
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest==8.3.3 pytest-asyncio==0.24.0 pytest-cov==6.0.0 httpx==0.27.2

      - name: Migrations
        run: |
          alembic upgrade head || echo "No migrations yet — skipping"

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # -------------------------------------------------------------------------
  # Judge worker — Python (worker code lives in backend/app/modules/submissions)
  # -------------------------------------------------------------------------
  judge-test:
    name: judge / test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install pytest==8.3.3 pytest-asyncio==0.24.0

      - name: Run judge tests
        run: pytest -v app/modules/submissions/tests

  # -------------------------------------------------------------------------
  # Frontend — Node
  # -------------------------------------------------------------------------
  frontend-lint:
    name: frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

  frontend-test:
    name: frontend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --silent -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

  # -------------------------------------------------------------------------
  # Infra — helm + docker compose validate
  # -------------------------------------------------------------------------
  infra-validate:
    name: infra / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Helm lint
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint ./helm

      - name: helm template
        run: |
          helm template algobattle ./helm \
            --set api.image=ghcr.io/test/api:latest \
            --set judge.image=ghcr.io/test/judge:latest \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

      - name: Docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /tmp/compose.yaml
          test -s /tmp/compose.yaml

      - name: Terraform fmt
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
        run: terraform fmt -check -recursive terraform/aws

      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Build images (only on main, for downstream CD)
  # -------------------------------------------------------------------------
  build-images:
    name: build / images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, judge-test, frontend-lint, frontend-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/algobattle-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push Judge
        uses: docker/build-push-action@v6
        with:
          context: ./judge
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/algobattle-judge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max