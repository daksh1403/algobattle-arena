[project]
name = "algobattle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.0,<0.142",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.1.0",

  # Database
  "SQLAlchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "apscheduler>=3.10.0",

  # Cache / Queue
  "redis>=5.0.0",
  "rq>=1.16.0",

  # Auth
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",

  # HTTP client (Judge0)
  "httpx>=0.27.0",

  # Misc
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "fakeredis>=2.23.0",
  "aiosqlite>=0.20.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "behave>=1.2.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing-imports = true
