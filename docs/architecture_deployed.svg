<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Menlo, Monaco, Consolas, monospace" font-size="13">
  <defs>
    <style>
      .box { fill: #1C2230; stroke: #3A4458; stroke-width: 1.5; rx: 8; }
      .label { fill: #E6EDF3; font-weight: bold; }
      .sub { fill: #7D8590; font-size: 11px; }
      .edge { fill: none; stroke: #FFA116; stroke-width: 2; marker-end: url(#arrow); }
      .edge-kv { fill: none; stroke: #58A6FF; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 5 3; }
      .t { fill: #B8C2CC; font-size: 11px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFA116"/>
    </marker>
    <marker id="arrow-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58A6FF"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFA116">AlgoBattle — Deployed Architecture (live at algobattle-arena.dakshx.workers.dev)</text>

  <!-- Browser -->
  <rect class="box" x="40" y="60" width="150" height="80"/>
  <text class="label" x="115" y="95" text-anchor="middle">Browser</text>
  <text class="sub" x="115" y="115" text-anchor="middle">React-free single-page</text>
  <text class="sub" x="115" y="128" text-anchor="middle">index.html (2k lines)</text>

  <!-- Cloudflare Worker -->
  <rect class="box" x="360" y="40" width="190" height="120"/>
  <text class="label" x="455" y="70" text-anchor="middle">Cloudflare Worker</text>
  <text class="sub" x="455" y="90" text-anchor="middle">algobattle-arena.dakshx.workers.dev</text>
  <text class="sub" x="455" y="108" text-anchor="middle">• static [assets]</text>
  <text class="sub" x="455" y="122" text-anchor="middle">• /api/leaderboard</text>
  <text class="sub" x="455" y="136" text-anchor="middle">• /api/submit proxy</text>
  <text class="sub" x="455" y="150" text-anchor="middle">• /standings/stream SSE</text>

  <!-- Cloudflare KV -->
  <rect class="box" x="700" y="60" width="160" height="80"/>
  <text class="label" x="780" y="95" text-anchor="middle">Cloudflare KV</text>
  <text class="sub" x="780" y="115" text-anchor="middle">leaderboard + submissions</text>
  <text class="sub" x="780" y="128" text-anchor="middle">(persists across restarts)</text>

  <!-- Cloudflare Tunnel -->
  <rect class="box" x="360" y="260" width="190" height="80"/>
  <text class="label" x="455" y="290" text-anchor="middle">Cloudflare Tunnel</text>
  <text class="sub" x="455" y="310" text-anchor="middle">TUNNEL_URL secret</text>
  <text class="sub" x="455" y="324" text-anchor="middle">*.trycloudflare.com</text>

  <!-- Local judge -->
  <rect class="box" x="40" y="300" width="200" height="90"/>
  <text class="label" x="140" y="330" text-anchor="middle">Judge backend</text>
  <text class="sub" x="140" y="348" text-anchor="middle">web_arena.py · FastAPI :8080</text>
  <text class="sub" x="140" y="362" text-anchor="middle">SandboxRunner (RLIMIT_AS/CPU/FSIZE)</text>
  <text class="sub" x="140" y="376" text-anchor="middle">Python · C++ · Java</text>

  <!-- Edges -->
  <path class="edge" d="M190,100 C270,100 300,100 358,100"/>
  <text class="t" x="270" y="90" text-anchor="middle">HTTPS</text>

  <path class="edge-kv" d="M550,80 L698,80"/>
  <text class="t" x="624" y="70" text-anchor="middle">KV put/get</text>

  <path class="edge" d="M455,162 L455,258"/>
  <text class="t" x="468" y="215" text-anchor="middle">/api/* proxied</text>

  <path class="edge" d="M358,300 C300,300 270,330 240,340"/>
  <text class="t" x="300" y="318" text-anchor="middle">localhost:8080</text>

  <text x="450" y="410" text-anchor="middle" fill="#4D5564" font-size="11">Frontend + KV are always-on at the edge. The judge runs on any host (laptop / Codespace / VPS) behind the tunnel.</text>
</svg>
